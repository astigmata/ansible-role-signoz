---
# Health Checks and Validation
- name: Wait for SigNoz Query Service to be healthy
  uri:
    url: "http://localhost:8080/api/v1/health"
    method: GET
    status_code: 200
    timeout: 10
    return_content: yes
  register: query_service_health
  until: query_service_health.status == 200 and query_service_health.json.status is defined and query_service_health.json.status == "ok"
  retries: 15
  delay: 10
  ignore_errors: true

- name: Test OTEL Collector gRPC endpoint
  wait_for:
    host: localhost
    port: 4317
    timeout: 30
    delay: 5
    state: started
  register: otel_grpc_health
  ignore_errors: true

- name: Test OTEL Collector HTTP endpoint
  wait_for:
    host: localhost
    port: 4318
    timeout: 30
    delay: 5
    state: started
  register: otel_http_health
  ignore_errors: true

- name: Get SigNoz container status
  command: docker ps --filter name=signoz --format "table {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}"
  register: container_status
  ignore_errors: true

- name: Create SigNoz monitoring script
  copy:
    content: |
      #!/bin/bash
      # SigNoz Health Check Script

      echo "=== SigNoz Container Status ==="
      sg docker -c "docker ps --filter name=signoz --format 'table {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}\t{{ '{{' }}.Ports{{ '}}' }}'"

      echo -e "\n=== SigNoz Service Health ==="
      curl -s -w "%{http_code}" http://localhost:8080/api/v1/health | grep -q 200 && echo "Healthy" || echo "Health check failed"

      echo -e "\n=== Resource Usage ==="
      sg docker -c "docker stats --no-stream --format 'table {{ '{{' }}.Name{{ '}}' }}\t{{ '{{' }}.CPUPerc{{ '}}' }}\t{{ '{{' }}.MemUsage{{ '}}' }}\t{{ '{{' }}.MemPerc{{ '}}' }}'" \$(sg docker -c "docker ps --filter name=signoz -q")

      echo -e "\n=== Disk Usage ==="
      df -h {{ signoz_data_dir }}
    dest: /usr/local/bin/signoz-status
    mode: '0755'
