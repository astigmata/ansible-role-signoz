- name: Update apt package cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install system prerequisites
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - git
      - htop
      - nano
      - unzip
      - python3-pip
      - python3-requests
      - python3-docker
    state: present

- name: Check if Docker is installed
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: docker_binary
  failed_when: not docker_binary.stat.exists
  changed_when: false

- name: Check if Docker Compose plugin is installed
  ansible.builtin.stat:
    path: /usr/libexec/docker/cli-plugins/docker-compose
  register: compose_binary
  failed_when: not compose_binary.stat.exists
  changed_when: false

- name: Verify current user can access Docker
  community.docker.docker_host_info:
  register: docker_info
  failed_when: docker_info.failed
  changed_when: false
