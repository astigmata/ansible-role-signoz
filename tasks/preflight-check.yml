- name: Update apt package cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install system prerequisites
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - git
      - htop
      - nano
      - unzip
      - python3-pip
      - python3-requests
      - python3-docker
    state: present

- name: Check if Docker is installed and accessible
  command: docker --version
  register: docker_check
  failed_when: docker_check.rc != 0
  changed_when: false

- name: Check if Docker Compose is available
  command: docker compose version
  register: compose_check
  failed_when: compose_check.rc != 0
  changed_when: false

- name: Verify current user can access Docker
  command: docker ps
  register: docker_access_check
  failed_when: docker_access_check.rc != 0
  changed_when: false
