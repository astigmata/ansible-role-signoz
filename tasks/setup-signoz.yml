# User Management
- name: Create SigNoz system user
  user:
    name: "{{ signoz_user }}"
    groups: docker
    append: true
    shell: /bin/bash
    system: true
    create_home: true

- name: Add vagrant user to docker group
  user:
    name: vagrant
    groups: docker
    append: true

# Directory Structure
- name: Create SigNoz directories
  file:
    path: "{{ item }}"
    state: directory
    owner: vagrant
    group: vagrant
    mode: '0755'
  loop:
    - "{{ signoz_install_dir }}"
    - "{{ signoz_data_dir }}"
    - "{{ signoz_config_dir }}"
    - "{{ signoz_data_dir }}/clickhouse"
    - "{{ signoz_data_dir }}/zookeeper"
    - "{{ signoz_data_dir }}/alertmanager"
    - "/var/log/signoz"

# SigNoz Repository and Configuration
- name: Clone SigNoz repository
  git:
    repo: https://github.com/SigNoz/signoz.git
    dest: "{{ signoz_install_dir }}"
    version: "v{{ signoz_version }}"
    force: true

- name: Set proper ownership of SigNoz directory
  file:
    path: "{{ signoz_install_dir }}"
    owner: vagrant
    group: vagrant
    recurse: true

# Environment Configuration
- name: Create SigNoz environment file
  template:
    src: templates/signoz.env.j2
    dest: "{{ signoz_install_dir }}/deploy/docker/clickhouse-setup/.env"
    owner: vagrant
    group: vagrant
    mode: '0644'
  notify: restart signoz

# Remove any existing override file that might be invalid
- name: Remove existing docker-compose override file
  file:
    path: "{{ signoz_install_dir }}/deploy/docker/clickhouse-setup/docker-compose.override.yml"
    state: absent

# Clean up any conflicting Docker networks
- name: Remove existing signoz-net network if it conflicts
  shell: docker network rm signoz-net || true
  ignore_errors: true

# SigNoz Deployment
- name: Deploy SigNoz with Docker Compose
  shell: |
    cd {{ signoz_install_dir }}/deploy/docker/clickhouse-setup
    docker compose down --remove-orphans || true
    docker compose pull
    docker compose up -d --remove-orphans
  become_user: vagrant
  register: signoz_deployment
  ignore_errors: true

- name: Display deployment results
  debug:
    var: signoz_deployment

# Service Management with Systemd
- name: Create systemd service file for SigNoz
  template:
    src: templates/signoz.service.j2
    dest: /etc/systemd/system/signoz.service
    mode: '0644'
  notify:
    - reload systemd
    - enable signoz service

# Health Checks and Validation
- name: Wait for SigNoz Query Service to be healthy
  uri:
    url: "http://localhost:8080/api/v1/health"
    method: GET
    status_code: 200
  register: query_service_health
  until: query_service_health.status == 200
  retries: 15
  delay: 10
  ignore_errors: true

- name: Display SigNoz health status
  debug:
    msg: "SigNoz Query Service: {{ 'OK' if query_service_health.status == 200 else 'FAILED' }}"

- name: Test OTEL Collector gRPC endpoint
  wait_for:
    host: localhost
    port: 4317
    timeout: 30
  register: otel_grpc_health
  ignore_errors: true

- name: Display OTEL gRPC status
  debug:
    msg: "OTEL gRPC (4317): {{ 'OK' if not otel_grpc_health.failed else 'FAILED' }}"

- name: Test OTEL Collector HTTP endpoint
  wait_for:
    host: localhost
    port: 4318
    timeout: 30
  register: otel_http_health
  ignore_errors: true

- name: Display OTEL HTTP status
  debug:
    msg: "OTEL HTTP (4318): {{ 'OK' if not otel_http_health.failed else 'FAILED' }}"

- name: Get SigNoz container status
  shell: 'docker ps --filter name=signoz --format "table {{{{ .Names }}}}\t{{{{ .Status }}}}"'
  register: container_status
  ignore_errors: true

- name: Display container status
  debug:
    var: container_status.stdout_lines
  when: container_status.stdout_lines is defined

# Performance monitoring setup
- name: Create SigNoz monitoring script
  copy:
    content: |
      #!/bin/bash
      # SigNoz Health Check Script
      
      echo "=== SigNoz Container Status ==="
      docker ps --filter name=signoz --format "table {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}\t{{ '{{' }}.Ports{{ '}}' }}"
      
      echo -e "\n=== SigNoz Service Health ==="
      curl -s http://localhost:8080/api/v1/health || echo "Health check failed"
      
      echo -e "\n=== Resource Usage ==="
      docker stats --no-stream --format "table {{ '{{' }}.Name{{ '}}' }}\t{{ '{{' }}.CPUPerc{{ '}}' }}\t{{ '{{' }}.MemUsage{{ '}}' }}\t{{ '{{' }}.MemPerc{{ '}}' }}" $(docker ps --filter name=signoz -q)
      
      echo -e "\n=== Disk Usage ==="
      df -h /opt/signoz-data
    dest: /usr/local/bin/signoz-status
    mode: '0755'

# Final status display
- name: Display deployment summary
  debug:
    msg: |
      ==========================================
      SigNoz v{{ signoz_version }} Deployment Complete!
      ==========================================
      
      Access URLs:
      - Web UI: http://localhost:8080
      - Web UI (VM): http://192.168.56.10:8080
      - OpenTelemetry gRPC: http://localhost:4317
      - OpenTelemetry HTTP: http://localhost:4318
      
      Management Commands:
      - Status: sudo systemctl status signoz
      - Container Status: /usr/local/bin/signoz-status
      - Logs: docker logs signoz
      - Restart: cd /opt/signoz/deploy/docker/clickhouse-setup && docker compose restart
      
      Data Directories:
      - Installation: {{ signoz_install_dir }}
      - Data: {{ signoz_data_dir }}
      
      Note: SigNoz v0.91+ uses unified architecture (single container)
      ==========================================