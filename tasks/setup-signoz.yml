---
# Docker Permission Management
- name: Ensure Docker socket has correct permissions
  file:
    path: /var/run/docker.sock
    owner: root
    group: docker
    mode: '0664'
  become: true

- name: Get current username for deployment
  command: whoami
  register: current_user
  changed_when: false
  become: false

- name: Set deployment user variable
  set_fact:
    deployment_user: "{{ current_user.stdout }}"

# User Management
- name: Create SigNoz system user
  user:
    name: "{{ signoz_user }}"
    groups: docker
    append: true
    shell: /bin/bash
    system: true
    create_home: true
  become: true

- name: Add deployment user to docker group
  user:
    name: "{{ deployment_user }}"
    groups: docker
    append: true
  become: true

- name: Test Docker access for deployment user (with retry)
  shell: sg docker -c "docker ps"
  become_user: "{{ deployment_user }}"
  become: true
  register: docker_test
  retries: 3
  delay: 2
  until: docker_test.rc == 0

# Directory Structure
- name: Create SigNoz directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deployment_user }}"
    group: "{{ deployment_user }}"
    mode: '0755'
  loop:
    - "{{ signoz_install_dir }}"
    - "{{ signoz_data_dir }}"
    - "{{ signoz_config_dir }}"
    - "{{ signoz_data_dir }}/clickhouse"
    - "{{ signoz_data_dir }}/zookeeper"
    - "{{ signoz_data_dir }}/alertmanager"
    - "/var/log/signoz"
  become: true

# SigNoz Repository and Configuration
- name: Clone SigNoz repository
  git:
    repo: https://github.com/SigNoz/signoz.git
    dest: "{{ signoz_install_dir }}"
    version: "v{{ signoz_version }}"
    force: true
  become_user: "{{ deployment_user }}"
  become: true

- name: Set proper ownership of SigNoz directory
  file:
    path: "{{ signoz_install_dir }}"
    owner: "{{ deployment_user }}"
    group: "{{ deployment_user }}"
    recurse: true
  become: true

# Environment Configuration
- name: Create SigNoz environment file
  template:
    src: templates/signoz.env.j2
    dest: "{{ docker_compose_path }}/.env"
    owner: "{{ deployment_user }}"
    group: "{{ deployment_user }}"
    mode: '0644'
  become: true
  notify: restart signoz

# Remove any existing override file that might be invalid
- name: Remove existing docker-compose override file
  file:
    path: "{{ docker_compose_path }}/docker-compose.override.yml"
    state: absent
  become: true

# Clean up any conflicting Docker networks
- name: Remove existing signoz-net network if it conflicts
  shell: docker network rm signoz-net || true
  become_user: "{{ deployment_user }}"
  become: true
  changed_when: false

# SigNoz Deployment
- name: Ensure Docker Compose file exists
  stat:
    path: "{{ signoz_install_dir }}/deploy/docker/docker-compose.yaml"
  register: compose_file
  failed_when: not compose_file.stat.exists

- name: Deploy SigNoz with Docker Compose (using shell with sg)
  shell: |
    cd {{ docker_compose_path }}
    sg docker -c "docker compose up -d --remove-orphans"
  become_user: "{{ deployment_user }}"
  become: true
  args:
    chdir: "{{ docker_compose_path }}"
  register: signoz_deployment

- name: Display deployment results
  debug:
    var: signoz_deployment

# Service Management with Systemd
- name: Create systemd service file for SigNoz
  template:
    src: templates/signoz.service.j2
    dest: /etc/systemd/system/signoz.service
    mode: '0644'
  become: true
  notify:
    - reload systemd
    - enable signoz service