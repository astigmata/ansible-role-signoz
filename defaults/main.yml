---
# SigNoz Configuration
signoz_version: "0.91.0"
signoz_install_dir: "/opt/signoz"
signoz_data_dir: "/opt/signoz-data"
signoz_config_dir: "/opt/signoz-config"

# User Management
signoz_user: "signoz"

# Network Configuration - Detection intelligente IP
vm_ip: "{{ override_vm_ip | default(ansible_default_ipv4.address) | default('localhost') }}"

# Docker Configuration
docker_compose_path: "{{ signoz_install_dir }}/deploy/docker"
signoz_container_recreate: "smart"