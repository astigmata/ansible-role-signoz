# defaults/main.yml
---
# SigNoz versions (basé sur le docker-compose officiel)
signoz_version: "v0.91.0"
signoz_otelcol_version: "v0.128.2"
signoz_schema_version: "v0.128.2"
clickhouse_version: "24.1.2-alpine"
zookeeper_version: "3.7.1"

# Configuration
signoz_user: "signoz"
signoz_group: "{{ signoz_user }}"
signoz_docker_users: ['vagrant']

# Directories
signoz_install_dir: "/opt/signoz"
signoz_data_dir: "/opt/signoz-data"
signoz_config_dir: "/opt/signoz-config"

# Ports
signoz_query_port: 8080
otel_grpc_port: 4317
otel_http_port: 4318
clickhouse_http_port: 8123
clickhouse_native_port: 9000

# Options
signoz_ignore_health_failures: false
signoz_telemetry_enabled: "true"